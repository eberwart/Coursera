<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#14323F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Guardianes" />
  <title>Guardianes del bienestar financiero</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="stage">
    <div class="device">
      <div class="app" id="app">
        <div class="status">
          <span id="clock">09:15</span>
          <span class="icons">●●● LTE 🔋</span>
        </div>
        <main class="screen" id="screen"></main>
        <nav class="tabs" id="tabs" hidden>
          <button data-tab="home"><span class="ico">📁</span>Mesa</button>
          <button data-tab="vault"><span class="ico">🔑</span>Claves</button>
          <button data-tab="bitacora"><span class="ico">📓</span>Bitácora</button>
        </nav>
        <div class="confetti" id="confetti"></div>
        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
  </div>
  <p class="hint-desk">Maqueta de app · ábrela en el teléfono o en esta vista de 390×844</p>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
