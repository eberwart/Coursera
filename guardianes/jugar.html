<!DOCTYPE html>
<!-- Juego completo en un solo archivo. Ábrelo en Chrome o Safari. Si lo ves en GitHub, usa el enlace htmlpreview del README. -->
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#14323F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Guardianes del bienestar financiero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --ink: #1b2a32;
  --ink-soft: #4a5c66;
  --paper: #f6efe4;
  --paper-2: #efe4d2;
  --cream: #fffaf3;
  --navy: #14323f;
  --navy-2: #1c4454;
  --gold: #e8a838;
  --gold-2: #f3c56b;
  --alert: #e24b4a;
  --ok: #2a9d8f;
  --safe: #5b6bc0;
  --warn: #e8873a;
  --shadow: 0 14px 40px rgba(20, 50, 63, 0.18);
  --radius: 22px;
  --font: "Nunito", "Segoe UI", system-ui, sans-serif;
  --display: "Fraunces", Georgia, serif;
  --phone-w: 390px;
  --phone-h: 844px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, #2a5a6c 0%, transparent 55%),
    radial-gradient(900px 500px at 110% 110%, #c9a227 0%, transparent 50%),
    #0e2430;
  min-height: 100%;
}

button, input, textarea { font-family: inherit; }
button { cursor: pointer; border: none; background: none; touch-action: manipulation; }
img { max-width: 100%; }

.stage {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.device {
  width: min(var(--phone-w), 100%);
  height: min(var(--phone-h), calc(100dvh - 48px));
  background: #0a0a0a;
  border-radius: 48px;
  padding: 12px;
  box-shadow:
    0 0 0 2px #2a2a2a,
    0 30px 80px rgba(0, 0, 0, 0.45);
  position: relative;
}

.device::before {
  content: "";
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 118px;
  height: 22px;
  background: #0a0a0a;
  border-radius: 14px;
  z-index: 8;
}

.app {
  height: 100%;
  background: var(--paper);
  border-radius: 36px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

.status {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 48px;
  padding: 14px 22px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 800;
  color: var(--navy);
  z-index: 6;
  pointer-events: none;
}
.app.dark { background: var(--navy); }
.app.dark .status { color: rgba(255,255,255,0.9); }
.app.dark .screen { padding-top: 0; }
.status .icons { display: flex; gap: 6px; align-items: center; letter-spacing: 0.04em; }

.screen {
  flex: 1;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  position: relative;
  padding-top: 48px;
}

.tabs {
  display: none;
  grid-template-columns: repeat(3, 1fr);
  padding: 8px 12px 16px;
  background: var(--cream);
  border-top: 1px solid rgba(20, 50, 63, 0.08);
  flex-shrink: 0;
}
.tabs.visible { display: grid; }
.tabs button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 800;
  color: var(--ink-soft);
  padding: 6px;
  border-radius: 14px;
}
.tabs button.active { color: var(--navy); background: rgba(20, 50, 63, 0.06); }
.tabs .ico { font-size: 18px; }

.pad { padding: 8px 20px 28px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; }
.muted { color: var(--ink-soft); }
.tiny { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.stamp {
  font-family: var(--display);
  font-weight: 800;
  letter-spacing: 0.04em;
}

h1, h2, h3 { font-family: var(--display); line-height: 1.15; }
h1 { font-size: 30px; }
h2 { font-size: 24px; }
h3 { font-size: 18px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 52px;
  border-radius: 16px;
  font-weight: 800;
  font-size: 16px;
  padding: 12px 16px;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn:active { transform: scale(0.98); }
.btn.primary {
  background: var(--navy);
  color: #fff;
  box-shadow: 0 8px 18px rgba(20, 50, 63, 0.25);
}
.btn.gold { background: var(--gold); color: var(--navy); }
.btn.ghost {
  background: transparent;
  color: var(--navy);
  border: 2px solid rgba(20, 50, 63, 0.15);
}
.btn.alert { background: var(--alert); color: #fff; }
.btn.ok { background: var(--ok); color: #fff; }
.btn:disabled { opacity: 0.45; }

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(20, 50, 63, 0.08);
  font-size: 18px;
}

.field, .area {
  width: 100%;
  border: 2px solid rgba(20, 50, 63, 0.12);
  background: var(--cream);
  border-radius: 14px;
  padding: 14px 14px;
  font-size: 16px;
  color: var(--ink);
  outline: none;
}
.area { min-height: 88px; resize: none; }
.field:focus, .area:focus { border-color: var(--navy); }

.splash {
  min-height: 100%;
  padding-top: 56px;
  background:
    radial-gradient(400px 280px at 50% 20%, rgba(232, 168, 56, 0.35), transparent 70%),
    var(--navy);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 56px 28px 32px;
  gap: 12px;
}
.badge {
  width: 108px;
  height: 108px;
  border-radius: 32px;
  background: linear-gradient(160deg, #e8a838, #c4841e);
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-size: 54px;
  font-weight: 800;
  color: var(--navy);
  box-shadow: 0 16px 32px rgba(0, 0, 0, 0.25);
  margin-bottom: 8px;
  animation: pop 0.7s ease;
}
.splash p { opacity: 0.8; font-weight: 700; }
.splash .course {
  margin-top: 8px;
  border: 1px solid rgba(255,255,255,0.25);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.hero {
  background: var(--navy);
  color: #fff;
  margin: -8px -20px 18px;
  padding: 8px 20px 22px;
  border-bottom-left-radius: 28px;
  border-bottom-right-radius: 28px;
}
.hero h1 { font-size: 26px; margin: 4px 0 6px; }
.hero .hello { opacity: 0.8; font-weight: 700; }

.keys-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-top: 14px;
}
.key-chip {
  background: rgba(255,255,255,0.1);
  border: 1px dashed rgba(255,255,255,0.25);
  border-radius: 12px;
  min-height: 46px;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.key-chip.on {
  background: var(--gold);
  color: var(--navy);
  border-style: solid;
  border-color: var(--gold);
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.folder {
  background: var(--cream);
  border-radius: 20px;
  padding: 14px 12px 12px;
  text-align: left;
  box-shadow: var(--shadow);
  min-height: 132px;
  position: relative;
  overflow: hidden;
  border: 0;
  width: 100%;
}
.folder-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 7px;
}
.folder .num {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  color: var(--ink-soft);
}
.folder .emo { font-size: 28px; margin: 8px 0 4px; display: block; }
.folder h3 { font-size: 16px; }
.folder .tag {
  margin-top: 8px;
  font-size: 11px;
  font-weight: 800;
  color: var(--ink-soft);
}
.folder .tag.on { color: var(--ok); }
.folder.wide { grid-column: 1 / -1; min-height: 92px; display: flex; align-items: center; gap: 12px; }
.folder.wide .emo { margin: 0; }

.vault-cta {
  margin-top: 14px;
  background: linear-gradient(135deg, #1c4454, #14323f);
  color: #fff;
  border-radius: 20px;
  padding: 16px;
  width: 100%;
  text-align: left;
  box-shadow: var(--shadow);
}
.vault-cta strong { font-family: var(--display); font-size: 18px; display: block; }
.vault-cta span { opacity: 0.8; font-size: 13px; font-weight: 700; }

.progress {
  height: 8px;
  background: rgba(20,50,63,0.1);
  border-radius: 99px;
  overflow: hidden;
  margin: 10px 0 16px;
}
.progress > i {
  display: block;
  height: 100%;
  background: var(--gold);
  border-radius: 99px;
}

.msg {
  background: var(--cream);
  border-radius: 22px;
  box-shadow: var(--shadow);
  overflow: hidden;
  margin: 8px 0 16px;
  touch-action: pan-y;
  user-select: none;
}
.msg-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  color: #fff;
  font-weight: 800;
}
.msg-head .av {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(255,255,255,0.2);
  font-size: 16px;
}
.msg.sms .msg-head { background: #3a3a3c; }
.msg.whatsapp .msg-head { background: #075e54; }
.msg.roblox .msg-head { background: #1a1a2e; }
.msg.game .msg-head { background: #1b3a5f; }
.msg.school .msg-head { background: #2f4d63; }
.msg.email .msg-head { background: #5c2c2c; }
.msg-body { padding: 16px 16px 18px; font-size: 15.5px; line-height: 1.45; white-space: pre-wrap; }
.msg-meta { padding: 0 16px 14px; font-size: 12px; font-weight: 800; color: var(--ink-soft); }

.choice {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 8px;
}
.choice .btn { min-height: 64px; flex-direction: column; gap: 2px; }
.choice small { font-weight: 700; opacity: 0.85; font-size: 11px; }

.card {
  background: var(--cream);
  border-radius: 20px;
  padding: 14px;
  box-shadow: 0 8px 22px rgba(20,50,63,0.08);
  margin-bottom: 12px;
  border: 2px solid transparent;
  text-align: left;
  width: 100%;
}
.card.selected { border-color: var(--navy); }
.card h3 { margin-bottom: 6px; }
.calc {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}
.calc label { font-size: 12px; font-weight: 800; color: var(--ink-soft); display: block; margin-bottom: 4px; }

.buckets { display: grid; gap: 10px; margin: 12px 0; }
.bucket {
  background: var(--cream);
  border: 2px dashed rgba(20,50,63,0.18);
  border-radius: 18px;
  padding: 12px;
  min-height: 74px;
}
.bucket.active { border-color: var(--navy); border-style: solid; background: #fff; }
.bucket .top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  min-width: 58px;
  height: 44px;
  padding: 0 12px;
  border-radius: 999px;
  background: var(--navy);
  color: #fff;
  font-weight: 800;
}
.chip.used { opacity: 0.3; }
.chip.picked { outline: 3px solid var(--gold); }

.risk, .prot {
  width: 100%;
  text-align: left;
  background: var(--cream);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  box-shadow: 0 6px 16px rgba(20,50,63,0.07);
  border: 2px solid transparent;
}
.risk { background: #fff3f1; }
.risk.sel { border-color: var(--alert); }
.prot { border-color: rgba(42,157,143,0.25); background: #f3faf8; }
.prot.wrong { animation: shake 0.35s ease; border-color: var(--alert); }
.ico-lg { font-size: 24px; flex-shrink: 0; }
.letters {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin: 8px 0 14px;
}
.letters span {
  width: 36px; height: 40px;
  border-radius: 10px;
  display: grid; place-items: center;
  font-family: var(--display);
  font-weight: 800;
  background: rgba(20,50,63,0.08);
}
.letters span.on { background: var(--gold); color: var(--navy); }

.pigs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pig {
  background: var(--cream);
  border-radius: 18px;
  padding: 12px;
  min-height: 0;
}
.check {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--cream);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 8px;
  width: 100%;
  text-align: left;
  border: 2px solid transparent;
}
.check.on { border-color: var(--alert); background: #fff4f3; }
.box {
  width: 22px; height: 22px; border-radius: 6px;
  border: 2px solid var(--navy);
  display: grid; place-items: center;
  flex-shrink: 0;
  font-size: 13px;
}

.offer {
  background: #2b1212;
  color: #fff;
  border-radius: 18px;
  padding: 14px;
  margin: 10px 0 14px;
  border: 2px dashed #e24b4a;
}
.offer h3 { color: #ffd166; margin-bottom: 6px; }

.feedback {
  background: var(--cream);
  border-radius: 20px;
  padding: 16px;
  line-height: 1.5;
  box-shadow: var(--shadow);
}
.key-reveal {
  margin: 16px 0;
  background: var(--navy);
  color: #fff;
  border-radius: 20px;
  padding: 18px;
  text-align: center;
}
.key-reveal .big {
  font-family: var(--display);
  font-size: 36px;
  color: var(--gold);
  letter-spacing: 0.08em;
}

.finale {
  text-align: center;
  padding-top: 12px;
}
.code-final {
  margin: 18px 0;
  background: var(--navy);
  color: var(--gold-2);
  border-radius: 22px;
  padding: 20px 12px;
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 0.04em;
  line-height: 1.4;
}

.log {
  background: var(--cream);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 10px;
}

.toast {
  position: absolute;
  left: 20px; right: 20px; bottom: 20px;
  background: var(--navy);
  color: #fff;
  padding: 12px 14px;
  border-radius: 14px;
  font-weight: 800;
  text-align: center;
  z-index: 9;
  animation: up 0.25s ease;
}

.confetti {
  pointer-events: none;
  position: absolute;
  inset: 0;
  overflow: hidden;
  z-index: 7;
}
.confetti i {
  position: absolute;
  top: -10px;
  font-size: 18px;
  animation: fall 1.6s linear forwards;
}

@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes up { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fall { to { transform: translateY(860px) rotate(220deg); opacity: 0.2; } }
@keyframes shake {
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

.app:has(.tabs.visible) .toast { bottom: 78px; }
.note { font-size: 13.5px; line-height: 1.45; color: var(--ink-soft); }
.space { height: 12px; }
.space-lg { height: 20px; }

@media (max-width: 720px), (display-mode: standalone) {
  .hint-desk { display: none; }
  .status { display: none; }
  .stage { padding: 0; }
  .device {
    width: 100%;
    height: 100dvh;
    height: 100svh;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }
  .device::before { display: none; }
  .app { border-radius: 0; }
  .screen { padding-top: max(12px, env(safe-area-inset-top)); }
  .app.dark .screen { padding-top: 0; }
  .splash { padding-top: max(48px, calc(env(safe-area-inset-top) + 24px)); min-height: 100%; }
  .tabs.visible { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .pad { padding-bottom: 32px; }
}

@media (min-width: 721px) {
  .hint-desk {
    position: fixed;
    bottom: 18px;
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    font-weight: 700;
    pointer-events: none;
  }
}

  </style>
</head>
<body>
  <div class="stage">
    <div class="device">
      <div class="app" id="app">
        <div class="status">
          <span id="clock">09:15</span>
          <span class="icons">●●● LTE 🔋</span>
        </div>
        <main class="screen" id="screen"></main>
        <nav class="tabs" id="tabs" hidden>
          <button data-tab="home"><span class="ico">📁</span>Mesa</button>
          <button data-tab="vault"><span class="ico">🔑</span>Claves</button>
          <button data-tab="bitacora"><span class="ico">📓</span>Bitácora</button>
        </nav>
        <div class="confetti" id="confetti"></div>
        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
  </div>
  <p class="hint-desk">Juega aquí mismo o abre este enlace en el teléfono</p>
  <script>
const GAME = {
  title: "Guardianes",
  subtitle: "Bienestar financiero",
  course: "6° Básico",

  stations: [
    {
      id: 1,
      code: "01",
      slug: "fraudes",
      title: "El detective anti-estafas",
      short: "Fraudes",
      emoji: "🔎",
      color: "#E24B4A",
      keyLabel: "Palabra",
      intro:
        "Revisa 8 mensajes. Sepáralos en ALERTA (parece un engaño) y NORMAL. Anota por qué te parecieron sospechosos los de alerta.",
      talk: "¿Has recibido alguna vez un mensaje parecido a alguno de estos? ¿Qué harías ahora, después de esta actividad?",
      feedback:
        "Las 4 alertas reales eran las tarjetas 1, 2, 4 y 6: todas pedían una contraseña o datos personales, o generaban apuro para que actuaras sin pensar. Las normales (3, 5, 7 y 8) venían de un contacto conocido y no pedían nada extraño. Para dudar de un mensaje, pregúntate: ¿me pide una clave o datos? ¿me apura a decidir ya? ¿es de alguien que realmente conozco?",
    },
    {
      id: 2,
      code: "02",
      slug: "consumo",
      title: "Antes de comprar, comparar",
      short: "Consumo",
      emoji: "👟",
      color: "#E8873A",
      keyLabel: "Dígito",
      intro:
        "Tomás quiere zapatillas de $30.000. Ya tiene $20.000. Le faltan $10.000. Su mesada es de $5.000 a la semana. Calcula las 3 opciones y elige la más conveniente.",
      talk: "¿Alguna vez tuviste que elegir entre comprar algo ahora o esperar a juntar la plata? ¿Qué elegiste y por qué?",
      feedback:
        "La opción más conveniente era la B: ahorrar dos mesadas. No cuesta nada extra y esperas lo mismo que en la A. La A parece más rápida, pero termina costando $3.000 de más — eso es lo que significa «pedir prestado con interés». La C tampoco cuesta extra, solo toma más tiempo (5 semanas), así que también es válida si de verdad no puedes esperar 2 semanas.",
    },
    {
      id: 3,
      code: "03",
      slug: "ahorro",
      title: "¿Qué haces con un regalo?",
      short: "Ahorro",
      emoji: "🐷",
      color: "#2A9D8F",
      keyLabel: "Código %",
      intro:
        "Recibiste $10.000 de cumpleaños. Elige 3 fichas de porcentaje (sin repetir) que sumen 100% para Ahorrar, Gastar y Compartir. El ahorro debe ser igual o mayor que el gasto.",
      talk: "¿Alguna vez ahorraste para algo que realmente querías? ¿Cómo te fue?",
      feedback:
        "No existe una única combinación correcta: lo importante es que el porcentaje de ahorro sea igual o mayor al de gasto. Por ejemplo, 40% ahorro / 30% gasto / 30% compartir funciona porque guardas más de lo que gastas, y además compartes algo.",
    },
    {
      id: 4,
      code: "04",
      slug: "cuidar",
      title: "Cada riesgo, su protección",
      short: "Cuidar",
      emoji: "🛡",
      color: "#5B6BC0",
      keyLabel: "Palabra",

(() => {
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];

  const STORAGE = "guardianes-v1";

  const defaultState = () => ({
    screen: "splash",
    tab: "home",
    name: "",
    keys: { 1: null, 2: null, 3: null, 4: null, 5: null },
    bitacora: [],
    reflections: {},
    play: null,
  });

  let state = load() || defaultState();
  let toastTimer = 0;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function save() {
    localStorage.setItem(STORAGE, JSON.stringify(state));
  }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function clp(n) {
    const v = Number(n) || 0;
    return "$" + Math.round(v).toLocaleString("es-CL");
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function station(id) {
    return GAME.stations.find((s) => s.id === id);
  }

  function doneCount() {
    return Object.values(state.keys).filter(Boolean).length;
  }

  function allDone() {
    return doneCount() === 5;
  }

  function clock() {
    const d = new Date();
    return d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", hour12: false });
  }

  function toast(msg) {
    clearTimeout(toastTimer);
    const el = $("#toast");
    el.textContent = msg;
    el.hidden = false;
    toastTimer = setTimeout(() => {
      el.hidden = true;
    }, 2200);
  }

  function confetti() {
    const box = $("#confetti");
    box.innerHTML = "";
    const bits = ["✦", "★", "●", "◆", "💰", "🔑"];
    for (let i = 0; i < 18; i++) {
      const n = document.createElement("i");
      n.textContent = bits[i % bits.length];
      n.style.left = 8 + Math.random() * 84 + "%";
      n.style.animationDelay = Math.random() * 0.4 + "s";
      box.appendChild(n);
    }
    setTimeout(() => {
      box.innerHTML = "";
    }, 2000);
  }

  function go(screen, extra) {
    const t = $("#toast");
    if (t) t.hidden = true;
    const c = $("#confetti");
    if (c) c.innerHTML = "";
    state.screen = screen;
    if (["home", "vault", "bitacora"].includes(screen)) state.tab = screen;
    if (extra) Object.assign(state, extra);
    save();
    render();
  }

  function setKey(id, value) {
    if (!state.keys[id]) {
      state.keys[id] = value;
      save();
      confetti();
    } else {
      state.keys[id] = value;
      save();
    }
  }

  function logEntry(title, body) {
    state.bitacora.unshift({
      t: Date.now(),
      title,
      body,
    });
    save();
  }

  function parseMoney(str) {
    const n = String(str || "").replace(/[^\d]/g, "");
    return n ? Number(n) : NaN;
  }

  function startStation(id) {
    const s = station(id);
    let play = { id, step: "intro" };
    if (id === 1) {
      play.queue = shuffle(GAME.cards.map((c) => c.id));
      play.index = 0;
      play.answers = {};
      play.reasons = {};
    }
    if (id === 2) {
      play.calcs = {
        A: { extra: "", weeks: "" },
        B: { extra: "", weeks: "" },
        C: { extra: "", weeks: "" },
      };
      play.choice = null;
      play.why = "";
    }
    if (id === 3) {
      play.assign = { ahorro: null, gasto: null, compartir: null };
      play.pickedChip = null;
      play.meta = "";
      play.why = "";
    }
    if (id === 4) {
      play.risks = shuffle(GAME.pairs.map((p) => p.id));
      play.prots = shuffle(GAME.pairs.map((p) => p.id));
      play.selRisk = null;
      play.matched = [];
      play.wrong = null;
    }
    if (id === 5) {
      play.b = "";
      play.diff = "";
      play.signals = [false, false, false, false];
    }
    state.play = play;
    state.tab = "home";
    go("station");
  }

  function header(s) {
    return `

  }

  function progressFor(id) {
    const p = state.play;
    if (!p || p.id !== id) return state.keys[id] ? 100 : 0;
    if (p.step === "intro") return 8;
    if (p.step === "feedback") return 100;
    if (id === 1) {
      const total = 8 + 1;
      return Math.round(((p.index + (p.step === "reasons" ? 8 : 0)) / total) * 90);
    }
    if (id === 4) return Math.round((p.matched.length / 6) * 90);
    return 45;

          )
          .join("")
      : `<p class="note">No marcaste ninguna alerta. Igual puedes enviar tu clasificación.</p>`;
    return `
      <div class="pad">
        ${header(s)}
        <h2>Tu bitácora de alertas</h2>
        <p class="note">En una frase corta, di por qué cada una te pareció sospechosa.</p>
        <div class="space"></div>
        ${list}
        <button class="btn primary" data-act="grade-1">Mostrar al cuartel</button>
      </div>
    `;
  }

  function renderConsumo(s) {
    const p = state.play;
    const opts = GAME.options
      .map((o) => {
        const c = p.calcs[o.id];
        return `
        <div class="card ${p.choice === o.id ? "selected" : ""}">
          <h3>Opción ${o.id} · ${esc(o.title)}</h3>
          <p class="note">${esc(o.text)}</p>
          <div class="calc">
            <div>
              <label>¿Cuánto paga de más?</label>
              <input class="field" inputmode="numeric" data-calc="${o.id}" data-k="extra" placeholder="$" value="${esc(c.extra)}" />
            </div>
            <div>
              <label>¿Cuántas semanas espera?</label>
              <input class="field" inputmode="numeric" data-calc="${o.id}" data-k="weeks" placeholder="semanas" value="${esc(c.weeks)}" />
            </div>
          </div>
          <div class="space"></div>
          <button class="btn ${p.choice === o.id ? "primary" : "ghost"}" data-act="choose" data-v="${o.id}">Elegir ${o.id}</button>
        </div>`;
      })
      .join("");
    return `
      <div class="pad">
        ${header(s)}
        <div class="card" style="background:#fff4e8">
          <div class="tiny">El caso de Tomás</div>
          <p>Zapatillas ${clp(30000)}. Ya tiene ${clp(20000)}. Le faltan ${clp(10000)}. Mesada: ${clp(5000)} / semana.</p>
        </div>
        ${opts}
        <label class="tiny">¿Cuál eligen y por qué?</label>
        <div class="space"></div>
        <textarea class="area" id="why2" placeholder="Escriban su respuesta…">${esc(p.why)}</textarea>
        <div class="space"></div>
        <button class="btn primary" data-act="grade-2">Pedir la clave</button>
      </div>
    `;
  }

  function renderAhorro(s) {
    const p = state.play;
    const cats = [
      ["ahorro", "🐷 Ahorrar", "Para una meta"],
      ["gasto", "🍦 Gastar", "Ahora"],
      ["compartir", "💛 Compartir", "Donar o regalar"],
    ];
    const used = Object.values(p.assign).filter((v) => v != null);
    const buckets = cats
      .map(([k, label, sub]) => {
        const val = p.assign[k];
        const money = val ? clp((GAME.gift * val) / 100) : "—";
        return `
          <button class="bucket ${p.pickedChip && val == null ? "active" : ""}" data-act="drop" data-k="${k}">
            <div class="top"><span>${label}</span><span>${val ? val + "%" : "vacío"}</span></div>
            <div class="note">${sub} · ${money}</div>
          </button>`;
      })
      .join("");
    const chips = GAME.chips
      .map((c) => {
        const cls = used.includes(c) ? "used" : p.pickedChip === c ? "picked" : "";
        return `<button class="chip ${cls}" data-act="chip" data-v="${c}">${c}%</button>`;
      })
      .join("");
    const sum = used.reduce((a, b) => a + b, 0);
    const ready = used.length === 3 && sum === 100;
    return `
      <div class="pad">
        ${header(s)}
        <h2>Reparto de ${clp(GAME.gift)}</h2>
        <p class="note">Elige 3 fichas distintas que sumen 100%. Toca una ficha y luego un cubo. Ahorro ≥ gasto.</p>
        <div class="buckets">${buckets}</div>
        <div class="tiny">Fichas ${sum}% / 100%</div>
        <div class="chip-row">${chips}</div>
        <div class="space"></div>
        <label class="tiny">Meta de ahorro</label>
        <div class="space"></div>
        <input class="field" id="meta" placeholder="Ej: unas zapatillas, un juego…" value="${esc(p.meta)}" />
        <div class="space"></div>
        <textarea class="area" id="why3" placeholder="¿Por qué esta combinación y no otra?">${esc(p.why)}</textarea>
        <div class="space"></div>
        <button class="btn primary" data-act="grade-3" ${ready ? "" : "disabled"}>Pedir la clave</button>
      </div>
    `;
  }

  function renderCuidar(s) {
    const p = state.play;
    const remainingRisks = p.risks.filter((id) => !p.matched.includes(id));
    const remainingProts = p.prots.filter((id) => !p.matched.includes(id));
    const letters = GAME.pairs
      .map(
        (x) =>
          `<span class="${p.matched.includes(x.id) ? "on" : ""}">${p.matched.includes(x.id) ? x.letter : "·"}</span>`
      )
      .join("");
    const risks = remainingRisks
      .map((id) => {
        const x = GAME.pairs.find((p) => p.id === id);
        return `
          <button class="risk ${p.selRisk === id ? "sel" : ""}" data-act="risk" data-id="${id}">
            <span class="ico-lg">${x.riskIcon}</span>
            <span><strong>${id}</strong><br>${esc(x.risk)}</span>
          </button>`;
      })
      .join("");
    const prots = remainingProts
      .map((id) => {
        const x = GAME.pairs.find((p) => p.id === id);
        return `
          <button class="prot ${p.wrong === id ? "wrong" : ""}" data-act="prot" data-id="${id}">
            <span class="ico-lg">${x.protIcon}</span>
            <span><strong>${id.replace("R", "P")}</strong><br>${esc(x.prot)}</span>
          </button>`;
      })
      .join("");
    return `
      <div class="pad">
        ${header(s)}
        <div class="letters">${letters}</div>
        <p class="note">${p.selRisk ? "Ahora elige la protección que corresponde." : "Toca un riesgo rosado y luego su protección verde."}</p>
        <div class="space"></div>
        <div class="tiny">Riesgos</div>
        <div class="space"></div>
        ${risks || "<p class='note'>¡Todas las parejas listas!</p>"}
        <div class="tiny">Protecciones</div>
        <div class="space"></div>
        ${prots}
      </div>
    `;
  }

  function renderCrecer(s) {
    const p = state.play;
    const checks = GAME.signals
      .map(
        (t, i) => `
        <button class="check ${p.signals[i] ? "on" : ""}" data-act="sig" data-i="${i}">
          <span class="box">${p.signals[i] ? "✓" : ""}</span>
          <span>${esc(t)}</span>
        </button>`
      )
      .join("");
    return `
      <div class="pad">
        ${header(s)}
        <div class="pigs">
          <div class="pig">
            <div class="tiny">Chanchito A</div>
            <div style="font-size:28px">🗄</div>
            <strong>Cajón</strong>
            <p class="note">En enero ${clp(50000)}. Lo deja quieto todo el año.</p>
            <div>Diciembre: <strong>${clp(50000)}</strong></div>
          </div>
          <div class="pig">
            <div class="tiny">Chanchito B</div>
            <div style="font-size:28px">🏦</div>
            <strong>Cuenta 5%</strong>
            <p class="note">Mismos ${clp(50000)}, gana un 5% en el año.</p>
            <label class="tiny">¿Cuánto tiene en diciembre?</label>
            <input class="field" id="pigb" inputmode="numeric" placeholder="$52.500" value="${esc(p.b)}" />
          </div>
        </div>
        <div class="space"></div>
        <label class="tiny">Diferencia entre los dos chanchitos</label>
        <div class="space"></div>
        <input class="field" id="diff" inputmode="numeric" placeholder="$2.500" value="${esc(p.diff)}" />
        <div class="offer">
          <div class="tiny">Solo hoy</div>
          <h3>⚡ Oferta especial</h3>
          <p>«Multiplica tu plata en 1 semana. Presta $5.000 a Grupo Ahorro Rápido y en solo 7 días recibes $20.000 ASEGURADO. Cupos limitados. No se lo cuentes a nadie más para que alcances a entrar.»</p>
        </div>
        <div class="tiny">Marca las señales de alerta</div>
        <div class="space"></div>
        ${checks}
        <div class="space"></div>
        <button class="btn primary" data-act="grade-5">Pedir el último dígito</button>
      </div>
    `;
  }

  function chrome(content, showTabs) {
    $("#screen").innerHTML = content;
    $("#tabs").hidden = !showTabs;
    $("#tabs").classList.toggle("visible", showTabs);
    $("#app").classList.toggle("dark", state.screen === "splash");
    $$("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
    $("#clock").textContent = clock();
  }

  function render() {
    const showTabs = ["home", "vault", "bitacora", "finale"].includes(state.screen);
    let html = "";
    if (state.screen === "splash") html = renderSplash();
    else if (state.screen === "onboard") html = renderOnboard();
    else if (state.screen === "home") html = renderHome();
    else if (state.screen === "vault") html = renderVault();
    else if (state.screen === "bitacora") html = renderBitacora();
    else if (state.screen === "finale") html = renderFinale();
    else if (state.screen === "station") html = renderStation();
    else html = renderHome();
    chrome(html, showTabs && state.screen !== "splash" && state.screen !== "onboard");
    bindSwipe();
    bindFields();
  }

  function bindFields() {
    const name = $("#name");
    if (name) name.addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveName();
    });
    $$("[data-calc]").forEach((inp) => {
      inp.addEventListener("input", () => {
        const id = inp.dataset.calc;
        const k = inp.dataset.k;
        state.play.calcs[id][k] = inp.value;
        save();
      });
    });
    $$("[data-reason]").forEach((inp) => {
      inp.addEventListener("input", () => {
        state.play.reasons[inp.dataset.reason] = inp.value;
        save();
      });
    });
    const why2 = $("#why2");
    if (why2) why2.addEventListener("input", () => { state.play.why = why2.value; save(); });
    const why3 = $("#why3");
    if (why3) why3.addEventListener("input", () => { state.play.why = why3.value; save(); });
    const meta = $("#meta");
    if (meta) meta.addEventListener("input", () => { state.play.meta = meta.value; save(); });
    const pigb = $("#pigb");
    if (pigb) pigb.addEventListener("input", () => { state.play.b = pigb.value; save(); });
    const diff = $("#diff");
    if (diff) diff.addEventListener("input", () => { state.play.diff = diff.value; save(); });
    const talk = $("#talk");
    if (talk) talk.addEventListener("input", () => { state.reflections[state.play.id] = talk.value; save(); });
  }

  function bindSwipe() {
    const card = $("#swipe-card");
    if (!card) return;
    let x0 = 0;
    let dx = 0;
    const start = (x) => { x0 = x; dx = 0; };
    const move = (x) => {
      dx = x - x0;
      card.style.transform = `translateX(${dx}px) rotate(${dx / 28}deg)`;
      card.style.opacity = String(1 - Math.min(0.4, Math.abs(dx) / 280));
    };
    const end = () => {
      if (dx > 80) classify("alerta");
      else if (dx < -80) classify("normal");
      else {
        card.style.transform = "";
        card.style.opacity = "";
      }
    };
    card.addEventListener("touchstart", (e) => start(e.touches[0].clientX), { passive: true });
    card.addEventListener("touchmove", (e) => move(e.touches[0].clientX), { passive: true });
    card.addEventListener("touchend", end);
    card.addEventListener("mousedown", (e) => {
      start(e.clientX);
      const mv = (ev) => move(ev.clientX);
      const up = () => {
        window.removeEventListener("mousemove", mv);
        window.removeEventListener("mouseup", up);
        end();
      };
      window.addEventListener("mousemove", mv);
      window.addEventListener("mouseup", up);
    });
  }

  function shareGame() {
    const url = location.href.split("#")[0];
    const payload = {
      title: "Guardianes del bienestar financiero",
      text: "Juega los 5 expedientes en el teléfono (6° básico).",
      url,
    };
    if (navigator.share) {
      navigator.share(payload).catch(() => {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        () => toast("Enlace copiado. Pégalo en WhatsApp o el correo."),
        () => toast(url)
      );
      return;
    }
    toast(url);
  }

  function saveName() {
    const v = ($("#name")?.value || state.name || "").trim();
    if (v.length < 2) {
      toast("Escribe tu nombre (al menos 2 letras)");
      return;
    }
    state.name = v;
    go("home");
  }

  function classify(v) {
    const p = state.play;
    const id = p.queue[p.index];
    p.answers[id] = v;
    p.index += 1;
    if (navigator.vibrate) navigator.vibrate(12);
    if (p.index >= p.queue.length) p.step = "reasons";
    save();
    render();
  }

  function gradeFraudes() {
    const p = state.play;
    const trueAlerts = GAME.cards.filter((c) => c.alert).map((c) => c.id);
    const marked = Object.entries(p.answers)
      .filter(([, v]) => v === "alerta")
      .map(([id]) => Number(id));
    const hits = trueAlerts.filter((id) => marked.includes(id)).length;
    const reasons = trueAlerts
      .filter((id) => marked.includes(id))
      .map((id) => `#${id}: ${p.reasons[id] || "(sin nota)"}`)
      .join(" · ");
    logEntry("Expediente 01 · Fraudes", `Alertas marcadas: ${marked.join(", ") || "ninguna"}. Aciertos de alerta: ${hits}/4. ${reasons}`);
    if (hits >= 3) {
      setKey(1, GAME.keys[1]);
      p.step = "feedback";
      save();
      render();
      toast("Clave obtenida: DUDA");
    } else {
      toast("Necesitas al menos 3 de las 4 alertas. Intenta de nuevo.");
      startStation(1);
      state.play.step = "play";
      save();
      render();
    }
  }

  function gradeConsumo() {
    const p = state.play;
    $$("[data-calc]").forEach((inp) => {
      p.calcs[inp.dataset.calc][inp.dataset.k] = inp.value;
    });
    const why = $("#why2");
    if (why) p.why = why.value;
    if (!p.choice) {
      toast("Elige una opción (A, B o C)");
      return;
    }
    let mathOk = true;
    for (const o of GAME.options) {
      const extra = parseMoney(p.calcs[o.id].extra);
      const weeks = Number(String(p.calcs[o.id].weeks).replace(/[^\d]/g, ""));
      if (extra !== o.extra || weeks !== o.weeks) mathOk = false;
    }
    if (!mathOk) {
      toast("Revisa los cálculos: extra y semanas de A, B y C.");
      return;
    }
    if (p.choice === "A") {
      toast("A cuesta $3.000 extra. Prueba B o C.");
      return;
    }
    setKey(2, GAME.keys[2]);
    logEntry(
      "Expediente 02 · Consumo",
      `Eligieron ${p.choice}. ${p.why || "Sin comentario."}`
    );
    p.step = "feedback";
    save();
    render();
    toast("Clave obtenida: 7");
  }

  function gradeAhorro() {
    const p = state.play;
    const meta = $("#meta");
    const why = $("#why3");
    if (meta) p.meta = meta.value;
    if (why) p.why = why.value;
    const a = p.assign.ahorro;
    const g = p.assign.gasto;
    const c = p.assign.compartir;
    if ([a, g, c].some((v) => v == null)) {
      toast("Asigna 3 fichas distintas");
      return;
    }
    if (a + g + c !== 100) {
      toast("Las 3 fichas deben sumar 100%");
      return;
    }
    if (a < g) {
      toast("El ahorro debe ser igual o mayor que el gasto");
      return;
    }
    const code = `${a / 10}${g / 10}${c / 10}`;
    setKey(3, code.split("").join("-"));
    logEntry(
      "Expediente 03 · Ahorro",
      `Ahorro ${a}% (${clp((GAME.gift * a) / 100)}) · Gasto ${g}% · Compartir ${c}%. Meta: ${p.meta || "—"}. ${p.why || ""}`
    );
    p.step = "feedback";
    save();
    render();
    toast("Código % obtenido: " + state.keys[3]);
  }

  function tryMatch(protId) {
    const p = state.play;
    if (!p.selRisk) {
      toast("Primero toca un riesgo");
      return;
    }
    if (p.selRisk === protId) {
      p.matched.push(protId);
      p.selRisk = null;
      p.wrong = null;
      if (navigator.vibrate) navigator.vibrate(16);
      if (p.matched.length === 6) {
        setKey(4, GAME.keys[4]);
        logEntry("Expediente 04 · Cuidar lo mío", "Seis parejas correctas. Palabra: SEGURO.");
        p.step = "feedback";
        save();
        render();
        toast("Clave obtenida: SEGURO");
        return;
      }
      save();
      render();
    } else {
      p.wrong = protId;
      save();
      render();
      toast("Esa protección no corresponde. Prueba otra.");
      setTimeout(() => {
        if (state.play) state.play.wrong = null;
      }, 400);
    }
  }

  function gradeCrecer() {
    const p = state.play;
    const pigb = $("#pigb");
    const diff = $("#diff");
    if (pigb) p.b = pigb.value;
    if (diff) p.diff = diff.value;
    const b = parseMoney(p.b);
    const d = parseMoney(p.diff);
    if (b !== 52500 || d !== 2500) {
      toast("Calcula el 5% de $50.000 y súmalo. La diferencia es ese 5%.");
      return;
    }
    if (!p.signals.every(Boolean)) {
      toast("Marca las 4 señales de alerta de la oferta.");
      return;
    }
    setKey(5, GAME.keys[5]);
    logEntry("Expediente 05 · Crecer", `Chanchito B ${clp(52500)}. Diferencia ${clp(2500)}. 4 señales marcadas.`);
    p.step = "feedback";
    save();
    render();
    toast("Dígito obtenido: 6");
  }

  function onClick(e) {
    const t = e.target.closest("[data-act], [data-tab]");
    if (!t) return;
    const act = t.dataset.act;
    const tab = t.dataset.tab;
    if (tab) {
      go(tab);
      return;
    }
    if (act === "begin") {
      go(state.name ? "home" : "onboard");
      return;
    }
    if (act === "save-name") return saveName();
    if (act === "skip-name") {
      const typed = ($("#name")?.value || "").trim();
      state.name = typed.length >= 2 ? typed : "Agente";
      go("home");
      return;
    }
    if (act === "share") return shareGame();
    if (act === "home") return go("home");
    if (act === "vault") return go(allDone() && t.classList.contains("vault-cta") && doneCount() === 5 ? "vault" : "vault");
    if (act === "finale") return go("finale");
    if (act === "open") return startStation(Number(t.dataset.id));
    if (act === "play") {
      state.play.step = "play";
      save();
      render();
      return;
    }
    if (act === "skip-fb") {
      state.play.step = "feedback";
      save();
      render();
      return;
    }
    if (act === "class") return classify(t.dataset.v);
    if (act === "grade-1") return gradeFraudes();
    if (act === "choose") {
      state.play.choice = t.dataset.v;
      save();
      render();
      return;
    }
    if (act === "grade-2") return gradeConsumo();
    if (act === "chip") {
      const v = Number(t.dataset.v);
      const used = Object.values(state.play.assign);
      if (used.includes(v)) {
        const k = Object.keys(state.play.assign).find((key) => state.play.assign[key] === v);
        state.play.assign[k] = null;
        state.play.pickedChip = null;
      } else {
        state.play.pickedChip = state.play.pickedChip === v ? null : v;
      }
      save();
      render();
      return;
    }
    if (act === "drop") {
      const p = state.play;
      if (p.pickedChip == null) {
        if (p.assign[t.dataset.k] != null) {
          p.assign[t.dataset.k] = null;
          save();
          render();
        } else toast("Toca primero una ficha");
        return;
      }
      p.assign[t.dataset.k] = p.pickedChip;
      p.pickedChip = null;
      save();
      render();
      return;
    }
    if (act === "grade-3") return gradeAhorro();
    if (act === "risk") {
      state.play.selRisk = t.dataset.id;
      save();
      render();
      return;
    }
    if (act === "prot") return tryMatch(t.dataset.id);
    if (act === "sig") {
      const i = Number(t.dataset.i);
      state.play.signals[i] = !state.play.signals[i];
      save();
      render();
      return;
    }
    if (act === "grade-5") return gradeCrecer();
    if (act === "save-talk") {
      const val = $("#talk")?.value || "";
      state.reflections[state.play.id] = val;
      if (val.trim()) logEntry("Para conversar · " + station(state.play.id).short, val.trim());
      go("home");
      return;
    }
    if (act === "reset") {
      if (confirm("¿Borrar el progreso de esta misión?")) {
        state = defaultState();
        state.screen = "onboard";
        save();
        render();
      }
    }
  }

  function init() {
    $("#clock").textContent = clock();
    setInterval(() => {
      const c = $("#clock");
      if (c) c.textContent = clock();
    }, 30000);
    document.addEventListener("click", onClick);
    document.addEventListener("focusin", (e) => {
      if (e.target.matches && e.target.matches("input, textarea")) {
        setTimeout(() => e.target.scrollIntoView({ block: "center", behavior: "smooth" }), 280);
      }
    });
    if ("serviceWorker" in navigator && !document.currentScript) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
    if (!state.screen) state.screen = "splash";
    render();
  }

  init();
})();

  </script>
</body>
